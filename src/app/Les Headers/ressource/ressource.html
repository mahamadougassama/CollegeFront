<section class="news-section" id="actualites">
    <div class="news-container">
        
        <!-- En-tête de la section -->
        <div class="news-intro">
            <span class="news-badge">Actualités & Événements</span>
            <h2 class="news-title">La Vie au Collège Royal</h2>
            <p class="news-lead">Restez informés des dernières actualités, des événements marquants et des réussites de nos élèves.</p>
        </div>

        <!-- Grille des Actualités (3 colonnes) -->
        <div class="news-grid"*ngFor="let a of list">
            
            <!-- Article 1 -->
            <article class="news-card">
                <div class="news-img-wrap">
                    <!-- Remplacez le src par votre image d'actualité -->
                    <img [src]="'http://localhost:8080/images/'+a.image" alt="Actualité Collège Royal">
                    
                </div>
                <div class="news-content">
                    <span class="news-category">Événement</span>
                    <h3>{{a.titre}}</h3>
                    <p>{{a.contenue}}</p>
                    <a href="#" class="news-link">Lire la suite →</a>
                </div>
            </article>

           
            

        </div>
    </div>
</section>
